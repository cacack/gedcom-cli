name: PR title

# Merge commits carry the PR title as their body, and release-please reads any
# conventional message on main, so a conventional PR title gives it a second
# copy of the change and duplicates the changelog entry. No repository setting
# avoids this: GitHub rejects a blank body with the default merge title. See
# README "Development".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: PR title isn't a conventional commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # release-please's own PR is exempt: `chore` is a type the changelog
          # hides. The exact form keeps a hand-written "chore(...): release"
          # from slipping through.
          if [[ "$TITLE" =~ ^chore\(main\):\ release\ [0-9] ]]; then
            echo "Release PR, exempt"
            exit 0
          fi
          # Dependabot PRs are retitled by dependabot-retitle.yml. That edit is
          # made with GITHUB_TOKEN, which triggers no workflow, so this check
          # would never see the corrected title and would stay red.
          if [[ "$AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR, retitled by dependabot-retitle.yml; exempt"
            exit 0
          fi
          if [[ "$TITLE" =~ ^[a-z]+(\(.+\))?!?:\  ]]; then
            echo "::error::Write the PR title as plain prose (e.g. 'Add a validate command'), not as a conventional commit; see README \"Development\""
            exit 1
          fi
          echo "Title is plain prose"
