name: Dependabot Auto-Merge

# Stub. The logic lives in cacack/workflows; see that repo's README.
#
# Patch and minor bumps merge themselves once the required checks pass. Majors,
# and anything Dependabot declines to classify, are left for manual review.
#
# `pull_request_target` because the called job reads the shared Dependabot
# App's key from the `dependabot` environment, which only `main` can deploy to.
# It also means this stub does not run on the PR that changes it.
on: pull_request_target

# Must grant at least what the called job declares, or GitHub rejects the call
# with `startup_failure` before any step runs.
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    uses: cacack/workflows/.github/workflows/dependabot-automerge.yml@48676c738ce02a31811733fcb69236c5220dc665 # v2.5.0
    secrets:
      # Mapped by name: the caller must pass a secret even when it exists only
      # in the environment. These resolve to the Dependabot App there, not to
      # the release steward.
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
