# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gedcom

builds:
  - id: gedcom
    main: ./cmd/gedcom
    binary: gedcom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Prefixed with "v" to match what `go install ...@vX.Y.Z` reports.
      - -X github.com/cacack/gedcom-cli/internal/cli.buildVersion=v{{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# release-please writes the changelog and the release notes.
changelog:
  disable: true

release:
  github:
    owner: cacack
    name: gedcom-cli
  # Upload to the release that release-please already created.
  mode: keep-existing
